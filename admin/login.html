<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso administrativo de Exclusive Shop.">
  <title>Acceso Administración | Exclusive Shop</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div style="min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;">
    <main class="card" style="width: min(100%, 420px); padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <a class="brand" href="../index.html" style="justify-content: center; margin-bottom: 0.5rem;">
          <span class="brand-icon"><i data-lucide="sparkles"></i></span>
          Exclusive Shop
        </a>
        <p class="eyebrow" style="justify-content: center;"><i data-lucide="lock"></i> Panel Administrativo</p>
      </div>

      <h1 style="font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem;">Iniciar Sesión</h1>
      <p class="muted" style="text-align: center; font-size: 0.9rem; margin-bottom: 1.5rem;">Acceso restringido para el equipo administrador.</p>

      <form id="admin-login-form" class="form-grid">
        <label class="field">
          Correo Electrónico
          <input id="admin-email" type="email" name="email" autocomplete="email" placeholder="admin@exclusiveshop.com" required>
        </label>

        <label class="field">
          Contraseña
          <input id="admin-password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>

        <p id="login-status" class="admin-status" role="alert" hidden></p>

        <button class="button button--accent button--full" type="submit" style="margin-top: 0.5rem;">
          <i data-lucide="log-in"></i> Iniciar Sesión
        </button>
      </form>
    </main>
  </div>

  <script src="../assets/js/app.js"></script>
  <script type="module" src="../assets/js/firebase/admin-login.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
