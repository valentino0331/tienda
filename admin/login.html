<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso administrativo de Exclusive Shop.">
  <title>Administración | Exclusive Shop</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="admin-body">
  <main class="login-card card">
    <a class="brand" href="../index.html">Exclusive Shop</a>
    <p class="eyebrow">Administración</p>
    <h1>Iniciar sesión</h1>
    <p class="muted">Acceso reservado para el equipo administrador.</p>
    <form id="admin-login-form" class="form-grid">
      <label class="field">Correo<input id="admin-email" type="email" name="email" autocomplete="email" placeholder="correo@ejemplo.com" required></label>
      <label class="field">Contraseña<input id="admin-password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <p id="login-status" class="muted" role="alert" hidden></p>
      <button class="button button--full" type="submit">Iniciar sesión</button>
    </form>
  </main>
  <script src="../assets/js/app.js"></script>
  <script type="module" src="../assets/js/firebase/admin-login.js"></script>
</body>
</html>
