<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel administrativo de Exclusive Shop.">
  <title>Dashboard | Exclusive Shop</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Administración">
      <a class="brand" href="../index.html">Exclusive Shop</a>
      <div class="nav-links">
        <span>Panel administrativo</span>
        <span id="admin-identity" class="muted" hidden></span>
        <button id="admin-logout" class="button" type="button">Salir</button>
      </div>
    </nav>
  </header>
  <main id="admin-dashboard-content" class="dashboard container" hidden>
    <header class="section-heading">
      <p class="eyebrow">Administración</p>
      <h1>Dashboard</h1>
      <p>Vista general preparada para la gestión de Exclusive Shop.</p>
    </header>
    <section class="dashboard-grid" aria-label="Indicadores del negocio">
      <article class="metric-card card"><p>Ventas</p><strong>S/ —</strong></article>
      <article class="metric-card card"><p>Ganancias</p><strong>S/ —</strong></article>
      <article class="metric-card card"><p>Inversión</p><strong>S/ —</strong></article>
      <article class="metric-card card"><p>Egresos</p><strong>S/ —</strong></article>
      <article class="metric-card card"><p>Pedidos</p><strong>—</strong></article>
      <article class="metric-card card"><p>Clientes</p><strong>—</strong></article>
      <article class="metric-card card"><p>Stock</p><strong>—</strong></article>
    </section>
  </main>
  <script src="../assets/js/app.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
      }
    }
  </script>
  <script type="module" src="../assets/js/firebase/admin-dashboard.js"></script>
</body>
</html>
