<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos | Administración Exclusive Shop</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body>
<header class="site-header"><nav class="nav container" aria-label="Administración"><a class="brand" href="../index.html">Exclusive Shop</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="categorias.html">Categorías</a><span>Productos</span><a href="inventario.html">Inventario</a><a href="pagos.html">Pagos</a><a href="reportes.html">Reportes</a><span id="admin-identity" class="muted" hidden></span><button id="admin-logout" class="button" type="button">Salir</button></div></nav></header>
<main id="admin-products-content" class="admin-page container" hidden><header class="admin-toolbar"><div><p class="eyebrow">Administración</p><h1>Productos</h1><p class="muted">Gestiona los productos disponibles para el catálogo.</p></div><a class="button button--outline" href="dashboard.html">Volver al dashboard</a></header><p id="products-status" class="admin-status" role="status" hidden></p><div class="admin-layout"><form id="product-form" class="admin-form card"><h2 id="product-form-title">Nuevo producto</h2><input id="product-id" type="hidden"><div class="form-grid"><label class="field">Nombre<input id="product-name" maxlength="120" required></label><label class="field">Descripción<textarea id="product-description" maxlength="1000" required></textarea></label><div class="form-grid form-grid--two"><label class="field">Marca (opcional)<input id="product-brand" maxlength="80" placeholder="Ej. Dior"></label><label class="field">SKU (opcional)<input id="product-sku" maxlength="50" placeholder="Ej. PER-DIO-001"></label></div><div class="form-grid form-grid--two"><label class="field">Precio regular (S/)<input id="product-regular-price" type="number" min="0" step="0.01" required></label><label class="field">Precio de oferta (S/, opcional)<input id="product-sale-price" type="number" min="0" step="0.01" aria-describedby="sale-price-help"><small id="sale-price-help" class="muted">Debe ser menor que el precio regular.</small></label></div><label class="field">Precio de costo (S/)<input id="product-cost-price" type="number" min="0" step="0.01" aria-describedby="cost-price-help"><small id="cost-price-help" class="muted">Requerido para activar/vender el producto. No se muestra públicamente.</small></label><label class="field">Categoría<select id="product-category" required><option value="">Cargando categorías…</option></select></label><label class="field">URL de imagen<input id="product-image" type="url" maxlength="2000" placeholder="https://…"></label><div class="form-grid form-grid--two"><label class="field">Stock<input id="product-stock" type="number" min="0" step="1" required aria-describedby="stock-help"><small id="stock-help" class="muted">Para productos existentes, ajusta el stock desde Inventario.</small></label><label class="field">Stock mínimo<input id="product-min-stock" type="number" min="0" step="1" required aria-describedby="min-stock-help"><small id="min-stock-help" class="muted">Umbral para alertas; no modifica el stock.</small></label></div><label class="field">Estado<select id="product-active"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><div class="admin-actions"><button id="product-submit" class="button" type="submit">Guardar producto</button><button id="product-cancel" class="button button--outline" type="button" hidden>Cancelar</button></div></div></form><section><h2>Productos registrados</h2><div id="products-list" class="admin-list" aria-live="polite"></div></section></div></main>
<script src="../assets/js/app.js"></script><script type="module" src="../assets/js/firebase/admin-productos.js"></script></body></html>
