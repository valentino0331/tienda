<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalles del producto en Exclusive Shop.">
  <title>Detalle de Producto | Exclusive Shop</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Navegación Principal">
      <a class="brand" href="index.html">
        <span class="brand-icon"><i data-lucide="crown"></i></span>
        Exclusive Shop
      </a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">
          <i data-lucide="home"></i> Inicio
        </a>
        <a class="nav-link" href="catalogo.html">
          <i data-lucide="grid"></i> Catálogo
        </a>
        <a class="cart-link" href="carrito.html">
          <i data-lucide="shopping-bag"></i> Carrito
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="page-section container">
    <p id="product-cart-message" class="cart-message" hidden></p>
    <div id="product-status" class="card catalog-status" style="padding: 2.5rem; text-align: center;">Cargando producto…</div>
    <div id="product-detail" hidden></div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <div>© <span data-current-year></span> Exclusive Shop. Todos los derechos reservados.</div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script type="module" src="assets/js/firebase/producto.js"></script>
</body>
</html>
