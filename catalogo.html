<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora el catálogo exclusivo de fragancias y productos premium de Exclusive Shop.">
  <title>Catálogo Exclusivo | Exclusive Shop</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Navegación Principal">
      <a class="brand" href="index.html">
        <span class="brand-icon"><i data-lucide="sparkles"></i></span>
        Exclusive Shop
      </a>
      <div class="nav-links">
        <a class="nav-link" href="catalogo.html">
          <i data-lucide="grid"></i> Catálogo
        </a>
        <a class="cart-link" href="carrito.html">
          <i data-lucide="shopping-bag"></i> Carrito
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="page-section container">
    <header class="section-heading">
      <p class="eyebrow"><i data-lucide="sparkles"></i> Catálogo Exclusivo</p>
      <h1>Nuestros Productos</h1>
      <p class="lead">Explora fragancias premium y artículos seleccionados con envío inmediato.</p>
    </header>

    <div class="catalog-controls">
      <div>
        <p class="field" style="margin-bottom:0.5rem;font-weight:700;display:inline-flex;align-items:center;gap:0.4rem;">
          <i data-lucide="sliders-horizontal"></i> Filtrar por categoría
        </p>
        <div id="category-filters" class="filter-list">
          <span class="filter">Cargando categorías…</span>
        </div>
      </div>
      <label class="catalog-search">
        Buscar productos
        <div class="search-input-wrapper">
          <i data-lucide="search"></i>
          <input id="catalog-search" type="search" placeholder="Buscar por nombre o descripción…">
        </div>
      </label>
    </div>

    <section aria-labelledby="products-title">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2 id="products-title" style="font-size:1.4rem;">Catálogo Disponible</h2>
        <p id="catalog-result-count" class="muted" hidden></p>
      </div>

      <div id="catalog-status" class="card catalog-status">Cargando catálogo…</div>
      <div id="catalog-products" class="product-grid" hidden></div>
    </section>
  </main>

  <footer class="footer container">
    © <span data-current-year></span> Exclusive Shop. Todos los derechos reservados.
  </footer>

  <script src="assets/js/app.js"></script>
  <script type="module" src="assets/js/firebase/catalogo.js"></script>
</body>
</html>
