<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Finaliza tu compra en Exclusive Shop."><title>Checkout | Exclusive Shop</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body>
  <header class="site-header"><nav class="nav container" aria-label="Principal"><a class="brand" href="index.html">Exclusive Shop</a><div class="nav-links"><a href="catalogo.html">Catálogo</a><a href="carrito.html">Carrito</a></div></nav></header>
  <main class="page-section container"><header class="section-heading"><h1>Finalizar compra</h1><p>Completa tus datos para preparar tu pedido.</p></header><div class="checkout-layout"><form class="form-card card" action="#" method="post"><h2>Datos de entrega</h2><div class="form-grid form-grid--two"><label class="field">Nombre completo<input type="text" name="name" autocomplete="name" placeholder="Tu nombre completo"></label><label class="field">Número de celular<input type="tel" name="phone" autocomplete="tel" placeholder="999 999 999"></label><label class="field">Dirección<input type="text" name="address" autocomplete="street-address" placeholder="Calle y número"></label><label class="field">Distrito<input type="text" name="district" autocomplete="address-level2" placeholder="Tu distrito"></label></div><label class="field">Método de pago<select name="payment"><option value="">Selecciona un método</option><option>Yape</option><option>Transferencia bancaria</option><option>Pago contra entrega</option></select></label><div class="yape-space">Espacio preparado para las instrucciones o código QR de Yape.</div></form><aside class="order-summary card" aria-label="Resumen del pedido"><h2>Resumen del pedido</h2><div class="summary-row"><span>Productos</span><span>—</span></div><div class="summary-row"><span>Envío</span><span>Por calcular</span></div><div class="summary-row summary-total"><span>Total</span><strong>S/ 0.00</strong></div><button class="button button--full" type="button">Confirmar pedido</button></aside></div></main>
  <footer class="footer container">© <span data-current-year></span> Exclusive Shop</footer><script src="assets/js/app.js"></script>
</body>
</html>
